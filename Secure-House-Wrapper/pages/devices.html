<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Devices</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <main class="page-container">
    <a class="text-link" href="../index.html">← Back to dashboard</a>

    <section class="panel" style="margin-top:20px">
      <p class="eyebrow">CONNECTED HOME</p>
      <h1>Smart Devices</h1>
      <p class="muted" style="margin:10px 0 20px">
        These are simulated device controls, not real hardware.
      </p>
      <div id="deviceList"></div>
    </section>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/devices.js"></script>
  <script>
    const list = document.getElementById("deviceList");

    Object.keys(SHDevices.defaults).forEach(name => {
      const button = document.createElement("button");
      button.className = "btn btn-ghost";
      button.style.margin = "6px";
      button.style.display = "block";

      function render() {
        button.textContent =
          name + ": " + (SHDevices.states[name] ? "ON" : "OFF");
      }

      render();

      button.addEventListener("click", () => {
        SHDevices.toggle(name);
        render();
      });

      list.appendChild(button);
    });
  </script>
</body>
</html>
